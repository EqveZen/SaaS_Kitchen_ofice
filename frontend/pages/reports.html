<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reports</title>

<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">

</head>

<body>

<header class="topbar">

<div class="brand">
Reports
</div>

<nav class="nav">

<a href="../index.html">Dashboard</a>
<a href="pos.html">POS</a>
<a href="kitchen.html">Kitchen</a>
<a href="admin.html">Admin</a>

</nav>

</header>


<main class="reports-layout">

<!-- DAILY REVENUE -->
<div class="metric-card">

<div class="muted small">
Daily revenue
</div>

<div class="metric" id="revenue">
0
</div>

</div>


<!-- ORDERS COUNT -->
<div class="metric-card">

<div class="muted small">
Orders today
</div>

<div class="metric" id="ordersCount">
0
</div>

</div>


<!-- AVG CHECK -->
<div class="metric-card">

<div class="muted small">
Average check
</div>

<div class="metric" id="avgCheck">
0
</div>

</div>


<!-- TOP ITEMS -->
<div class="metric-card">

<h3>Top dishes</h3>

<div id="topItems"></div>

</div>


<!-- RECENT ORDERS -->
<div class="metric-card">

<h3>Recent orders</h3>

<table>

<thead>

<tr>
<th>Order</th>
<th>Status</th>
<th>Total</th>
<th>Time</th>
</tr>

</thead>

<tbody id="recentOrders"></tbody>

</table>

</div>

</main>


<script type="module">

import {Store} from "../js/core/store.js"
import {currency, time} from "../js/utils/format.js"
import {initApp} from "../js/core/app.js"

initApp()

Store.subscribe(render)

/* ===============================
   RENDER REPORTS
=============================== */

function render(){

renderRevenue()
renderOrdersCount()
renderAverageCheck()
renderTopItems()
renderRecentOrders()

}

/* ===============================
   DAILY REVENUE
=============================== */

function renderRevenue(){

const payments = Store.get("payments")

const total = payments.reduce(
(sum,p)=>sum + p.amount,
0
)

document
.getElementById("revenue")
.innerText = currency(total)

}

/* ===============================
   ORDERS COUNT
=============================== */

function renderOrdersCount(){

const orders = Store.get("orders")

document
.getElementById("ordersCount")
.innerText = orders.length

}

/* ===============================
   AVERAGE CHECK
=============================== */

function renderAverageCheck(){

const orders = Store.get("orders")

if(!orders.length){

document.getElementById("avgCheck").innerText="0"

return

}

const total = orders.reduce(
(s,o)=>s+o.total,0
)

const avg = total / orders.length

document
.getElementById("avgCheck")
.innerText = currency(avg)

}

/* ===============================
   TOP ITEMS
=============================== */

function renderTopItems(){

const orders = Store.get("orders")

const counts = {}

orders.forEach(o=>{

o.items.forEach(i=>{

counts[i.name] =
(counts[i.name] || 0) + i.qty

})

})

const sorted = Object.entries(counts)
.sort((a,b)=>b[1]-a[1])
.slice(0,5)

const el = document.getElementById("topItems")

el.innerHTML=""

sorted.forEach(([name,count])=>{

const div=document.createElement("div")

div.className="flex-between mt"

div.innerHTML=`

<span>${name}</span>
<span>${count}</span>

`

el.appendChild(div)

})

}

/* ===============================
   RECENT ORDERS
=============================== */

function renderRecentOrders(){

const orders = Store.get("orders")

const el = document.getElementById("recentOrders")

el.innerHTML=""

orders
.slice(-10)
.reverse()
.forEach(o=>{

const tr=document.createElement("tr")

tr.innerHTML=`

<td>${o.number}</td>

<td>${o.status}</td>

<td>${currency(o.total)}</td>

<td>${time(o.created)}</td>

`

el.appendChild(tr)

})

}

</script>

</body>

</html>
